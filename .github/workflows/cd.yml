name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_once:
        description: Deploy this run to production once. Does not enable DEPLOY_ENABLED for future pushes.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: sha-${{ github.sha }}
  VITE_API_BASE_URL: https://api.michat.in

jobs:
  main-ref-guard:
    name: Require main branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unauthorized refs
        run: bash deploy/cd-gate.sh require-main

  ci:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: main-ref-guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write
      pull-requests: read

  publish:
    name: Publish GHCR images
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image names
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "API_IMAGE=ghcr.io/${owner_repo}/api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${owner_repo}/web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false

  deploy-gate:
    name: Deploy gate
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_ONCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_once || '' }}
        run: |
          if bash deploy/cd-gate.sh should-deploy; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to VPS
    needs: [publish, deploy-gate]
    # Push deploys only when DEPLOY_ENABLED=true. Manual deploys need deploy_once=true on main.
    if: ${{ github.ref == 'refs/heads/main' && needs.deploy-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm deploy authorization
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_ONCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_once || '' }}
        run: bash deploy/cd-gate.sh should-deploy
      - name: Require SSH known_hosts
        run: |
          if [ -z "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" ]; then
            echo "Set production secret VPS_SSH_KNOWN_HOSTS before enabling deploy." >&2
            exit 1
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Set VPS_HOST, VPS_USER and VPS_SSH_KEY before enabling deploy." >&2
            exit 1
          fi
          if [ "${{ secrets.VPS_USER }}" != "deploy" ]; then
            echo "VPS_USER must be deploy, not root or another account, so GHCR Docker credentials apply." >&2
            exit 1
          fi
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync Compose and deploy scripts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          PORT="${VPS_PORT:-22}"
          DIR="${DEPLOY_DIR:-/opt/company-chat}"
          ssh -i ~/.ssh/deploy_key -p "${PORT}" "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${DIR}/deploy' '${DIR}/secrets' '${DIR}/backups'"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${PORT}" \
            docker-compose.prod.yml docker-compose.prod.local-s3.yml docker-compose.prod.vps.yml \
            "${VPS_USER}@${VPS_HOST}:${DIR}/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${PORT}" \
            deploy/ \
            --exclude '.env.production' --exclude 'backups/' \
            "${VPS_USER}@${VPS_HOST}:${DIR}/deploy/"
      - name: Pull verified images and health-check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          PORT="${VPS_PORT:-22}"
          DIR="${DEPLOY_DIR:-/opt/company-chat}"
          REMOTE_USER="$(ssh -i ~/.ssh/deploy_key -p "${PORT}" "${VPS_USER}@${VPS_HOST}" "id -un")"
          if [ "$REMOTE_USER" != "deploy" ] || [ "$VPS_USER" != "deploy" ]; then
            echo "Refusing to deploy as ${REMOTE_USER}. Set VPS_USER to deploy so GHCR credentials in that user's Docker config apply." >&2
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -p "${PORT}" "${VPS_USER}@${VPS_HOST}" \
            "chmod +x ${DIR}/deploy/*.sh && cd ${DIR} && ./deploy/deploy.sh ${IMAGE_TAG}"

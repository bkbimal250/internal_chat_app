name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: sha-${{ github.sha }}
  VITE_API_BASE_URL: https://api.michat.in

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write
      pull-requests: read

  publish:
    name: Publish GHCR images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image names
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "API_IMAGE=ghcr.io/${owner_repo}/api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${owner_repo}/web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false

  deploy:
    name: Deploy to VPS
    needs: publish
    # Push to main never deploys. Live deploy requires an explicit workflow_dispatch
    # after repository variable DEPLOY_ENABLED is set to true.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require SSH known_hosts
        run: |
          if [ -z "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" ]; then
            echo "Set production secret VPS_SSH_KNOWN_HOSTS before enabling deploy." >&2
            exit 1
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Set VPS_HOST, VPS_USER and VPS_SSH_KEY before enabling deploy." >&2
            exit 1
          fi
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync Compose and deploy scripts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          PORT="${VPS_PORT:-22}"
          DIR="${DEPLOY_DIR:-/opt/company-chat}"
          ssh -i ~/.ssh/deploy_key -p "${PORT}" "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${DIR}/deploy' '${DIR}/secrets' '${DIR}/backups'"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${PORT}" \
            docker-compose.prod.yml docker-compose.prod.local-s3.yml docker-compose.prod.vps.yml \
            "${VPS_USER}@${VPS_HOST}:${DIR}/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${PORT}" \
            deploy/ \
            --exclude '.env.production' --exclude 'backups/' \
            "${VPS_USER}@${VPS_HOST}:${DIR}/deploy/"
      - name: Pull verified images and health-check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
        run: |
          PORT="${VPS_PORT:-22}"
          DIR="${DEPLOY_DIR:-/opt/company-chat}"
          ssh -i ~/.ssh/deploy_key -p "${PORT}" "${VPS_USER}@${VPS_HOST}" \
            "chmod +x ${DIR}/deploy/*.sh && cd ${DIR} && ./deploy/deploy.sh ${IMAGE_TAG}"

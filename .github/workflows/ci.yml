name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Confirm production API origin is embedded
        run: |
          VITE_API_BASE_URL=https://api.michat.in npm run build
          grep -R --fixed-strings 'https://api.michat.in' dist
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose (external S3)
        run: docker compose --env-file deploy/.env.production.example -f docker-compose.prod.yml config --quiet
      - name: Validate production Compose (in-cluster LocalStack)
        run: docker compose --env-file deploy/.env.production.example -f docker-compose.prod.yml -f docker-compose.prod.local-s3.yml config --quiet
      - name: Validate VPS Compose (host Nginx and host PostgreSQL)
        run: docker compose --env-file deploy/.env.vps.example -f docker-compose.prod.vps.yml config --quiet
      - name: Confirm production Compose has no application build keys
        run: |
          if docker compose --env-file deploy/.env.production.example -f docker-compose.prod.yml config | grep -E '^\s+build:'; then
            echo "Production Compose must use image: only" >&2
            exit 1
          fi
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: false
          load: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=min,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: false
          build-args: |
            VITE_API_BASE_URL=https://api.michat.in
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web

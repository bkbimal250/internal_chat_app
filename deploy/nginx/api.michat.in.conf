# Host Nginx vhost for Fastify REST + authenticated WebSocket.
# Install only after review. Do not enable automatically.
#
#   sudo cp deploy/nginx/api.michat.in.conf /etc/nginx/sites-available/api.michat.in
#   sudo nginx -t
#   # After approval: sudo ln -s /etc/nginx/sites-available/api.michat.in /etc/nginx/sites-enabled/
#   # After approval: sudo systemctl reload nginx
#
# Does not use default_server. michat.in is untouched.
# Obtain certificates before enabling the TLS server, for example:
#   sudo certbot certonly --nginx -d api.michat.in

upstream company_chat_api {
    server 127.0.0.1:3045;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.michat.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.michat.in;

    ssl_certificate     /etc/letsencrypt/live/api.michat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.michat.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;
    client_body_timeout 120s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain;

    location = /health/live {
        proxy_pass http://company_chat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://company_chat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    location /api/v1/ws {
        proxy_pass http://company_chat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://company_chat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

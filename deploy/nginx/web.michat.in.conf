# Host Nginx vhost for the React SPA.
# Install only after review. Do not enable automatically.
#
#   sudo cp deploy/nginx/web.michat.in.conf /etc/nginx/sites-available/web.michat.in
#   sudo nginx -t
#   # After approval: sudo ln -s /etc/nginx/sites-available/web.michat.in /etc/nginx/sites-enabled/
#   # After approval: sudo systemctl reload nginx
#
# Does not use default_server. michat.in is untouched.
# Obtain certificates before enabling the TLS server, for example:
#   sudo certbot certonly --nginx -d web.michat.in

upstream company_chat_web {
    server 127.0.0.1:3046;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name web.michat.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.michat.in;

    ssl_certificate     /etc/letsencrypt/live/web.michat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.michat.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /assets/ {
        proxy_pass http://company_chat_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://company_chat_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-cache" always;
    }
}

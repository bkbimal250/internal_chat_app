name: company_chat
description: WhatsApp-style Company Chat for Android and iOS.
publish_to: "none"
version: 1.0.3+5

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  dio: ^5.9.0
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  emoji_picker_flutter: ^4.3.0
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  record: ^6.1.2
  photo_view: ^0.15.0
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  path_provider: ^2.1.5
  path: ^1.9.1
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  video_player: ^2.14.1
  url_launcher: ^6.3.3
  flutter_image_compress: ^2.5.1
  video_compress: ^3.1.4
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2
  flutter_webrtc: ^1.2.0
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  flutter_slidable: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.3
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#0F1925"
  adaptive_icon_foreground: assets/icons/app_icon.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#0F1925"

flutter:
  uses-material-design: true
